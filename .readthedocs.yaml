# This branch only holds the datasets of the tutorials, Read the Docs publishes a page pointing to the documentation
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  commands:
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - echo '<p>Datasets of the tutorials, see <a href="https://shaggy.readthedocs.io">shaggy.readthedocs.io</a>.</p>' > $READTHEDOCS_OUTPUT/html/index.html
