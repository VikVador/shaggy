[project]
name = "shaggy"
dynamic = ["version"]
description = "Distributed training in PyTorch"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
  "albus @ git+https://github.com/VikVador/albus@main",
  "azula @ git+https://github.com/probabilists/azula@dev",
  "einops==0.8.0",
  "numpy==2.4.6",
  "omegaconf==2.3.1",
  "torch==2.12.0",
  "tqdm==4.66.4",
  "zarr==3.1.2",
]

[project.optional-dependencies]
all = [
  "docutils==0.19",
  "furo==2024.5.6",
  "jupyterlab==4.2.2",
  "ipykernel==6.29.5",
  "matplotlib==3.9.0",
  "piqa>=1.3.2",
  "pre-commit==3.7.1",
  "pytest==8.2.2",
  "ruff==0.9.9",
  "scikit-image>=0.24",
  "sphinx==7.3.7",
  "torchvision>=0.27",
]
docs = [
  "docutils==0.19",
  "furo==2024.5.6",
  "sphinx==7.3.7",
]

[project.urls]
documentation = "https://shaggy.readthedocs.io"
source = "https://github.com/VikVador/shaggy"

[tool.ruff]
line-length = 99
exclude = ["notebook/"]

[tool.ruff.lint]
extend-select = ["ANN", "B", "I", "UP", "W"]
ignore = ["ANN002", "ANN003", "ANN401", "E731", "E741"]
preview = true

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401", "F403"]
"test_*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
lines-between-types = 1
relative-imports-order = "closest-to-furthest"
section-order = ["future", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
preview = true

[tool.setuptools.dynamic]
version = {attr = "shaggy.__version__"}

[tool.setuptools.packages.find]
include = ["shaggy*"]
